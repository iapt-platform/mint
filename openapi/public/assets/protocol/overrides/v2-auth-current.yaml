# 手写补充：GET /v2/auth/current 的 data 逐字段类型（对齐移动端 AuthUser）。
get:
  deprecated: true
  description: |
    已被 `GET /v3/me` 取代。保留给 dashboard-v4 与 wikipali-mobile（尚未切换），待两者都不再使用后删除。
  responses:
    200:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                  nickName:
                    type: string
                  realName:
                    type: string
                  avatar:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
