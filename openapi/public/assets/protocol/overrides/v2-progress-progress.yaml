# 手写补充：GET /v2/progress/{progress} 的 data 逐字段类型（对齐移动端 ProgressChapterInfo）。
# 只补 get 的响应，put/patch/delete 保持自动生成结果。
get:
  responses:
    200:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                properties:
                  book:
                    type: integer
                  para:
                    type: integer
                  channel_id:
                    type: string
                  title:
                    type: string
