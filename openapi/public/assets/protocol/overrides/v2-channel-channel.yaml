# 手写补充：GET /v2/channel/{channel} 的 data 逐字段类型（对齐移动端 ChannelInfo）；
# 2026-11-16 起整条已被 v3 取代。
get:
  deprecated: true
  description: |
    已被 `GET /v3/channels/{channel}` 取代（带 `abilities`、拥有者可以是团队）。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
  responses:
    200:
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  summary:
                    type: string
                    nullable: true
                  lang:
                    type: string
                  type:
                    type: string
                  updated_at:
                    type: string
                  studio:
                    type: object
                    properties:
                      id:
                        type: string
                      nickName:
                        type: string
                      realName:
                        type: string
                      studioName:
                        type: string
                      avatar:
                        type: string
put:
  deprecated: true
  description: |
    已被 `PATCH /v3/channels/{channel}`（局部更新）取代。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
patch:
  deprecated: true
  description: |
    已被 `PATCH /v3/channels/{channel}`（局部更新）取代。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
delete:
  deprecated: true
  description: |
    已被 `DELETE /v3/channels/{channel}`（软删除）取代。2026-11-16 起两边都是软删除。
    保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
