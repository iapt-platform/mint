# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-search-suggest.yaml
get:
  summary: 自动建议接口
  tags:
    - search-suggest
  operationId: get_api_v3_search_suggest
  description: |-
    基于 OpenSearch completion suggester，支持从不同字段获取建议。
    - q (string): 输入的部分文本（必填）
    - fields (string|array): 要查询的字段，可选值：
    - 不传：查询所有字段 (title, content, page_refs)
    - 单个字段：'title' | 'content' | 'page_refs'
    - 多个字段：'title,content' 或 ['title', 'content']
    - language (string): 语言过滤，可选（如：pali, zh, en）
    - limit (int): 每个字段返回的建议数量，默认 10，最大 50

    实现：`SearchSuggestController@index`
  parameters:
    -
      name: q
      in: query
      schema:
        type: string
        default: ''
    -
      name: fields
      in: query
      schema:
        type: string
    -
      name: language
      in: query
      schema:
        type: string
    -
      name: limit
      in: query
      schema:
        type: string
    -
      name: search
      in: query
      description: 搜索关键字
      schema:
        type: string
    -
      name: order
      in: query
      description: 排序字段
      schema:
        type: string
    -
      name: dir
      in: query
      description: 排序方向
      schema:
        type: string
        enum:
          - desc
          - asc
    -
      name: offset
      in: query
      description: 从第几条记录开始提取
      schema:
        type: number
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
post:
  summary: '新建 search-suggest'
  tags:
