# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-studios-studio-terms-imports.yaml
post:
  summary: '向 studio 导入术语'
  tags:
    - studios
  operationId: post_api_v3_studios_studio_terms_imports
  description: |-
    上传 xlsx。`channel_id` 列有值的行落在那个 channel（必须属于这个 studio、你能写），没有的是 studio 通用术语
    （要填 `language`；新建要团队 owner / manager，修改团队 editor 也行）。其余规则同向 channel 导入：
    部分成功、word / tag 不能改、带 etag 列时校验。AI 模型不能导入。最多 5000 行。

    实现：`V3\StudioTermImportController@__invoke`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: studio
      in: path
      required: true
      schema:
        type: string
      description: '用户或团队的 uuid'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
              description: 'xlsx 表格，不超过 5MB'
          required:
            - file
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  unchanged:
                    type: integer
                  reindexed:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties: { row: { type: integer }, message: { type: string } }
    401:
      $ref: '../../main.yaml#/components/responses/ProblemUnauthorized'
    403:
      description: 不是本人，也不是团队成员
      content:
        application/problem+json:
          schema:
            $ref: '../../main.yaml#/components/schemas/ProblemDetails'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
