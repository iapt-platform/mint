patch:
  summary: 修改话题或回复（局部更新）
  tags:
    - discussions
  operationId: patch_api_v3_discussions_discussion_
  description: |-
    只改传了的字段。title / status / type / severity 只对话题有效，回复传了 422。
    作者或对象的管理者（句子、逐词所在 channel 的编辑者，文章的编辑者）可改；
    改 type 时回复跟着改，新类型不收原来的 severity 时 severity 清空。

    实现：`V3\DiscussionController@update`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: discussion
      in: path
      required: true
      schema:
        type: string
      description: '话题或回复的 uuid'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
              description: 标题（只限话题）
            content:
              type: string
              description: 正文（markdown）
            status:
              type: string
              description: 状态（只限话题）
              enum:
                - active
                - close
            type:
              type: string
              description: 话题类型（只限话题）
              enum:
                - discussion
                - qa
                - help
                - issue
            severity:
              type: string
              description: '严重程度（只限话题），null 表示清空'
              enum:
                - error
                - warning
                - info
                - urgent
                - normal
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
