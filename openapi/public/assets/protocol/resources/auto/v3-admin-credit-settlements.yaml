# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-admin-credit-settlements.yaml
post:
  summary: 手工结算积分
  tags:
    - admin
  operationId: post_api_v3_admin_credit_settlements
  description: |-
    把登录用户的读经、编辑时长结算成积分。可重复执行：同一用户同一天的积分是覆盖不是累加，不会重复入账。
    不给 `date`：从积分上线日到昨天，补齐所有漏结算的「用户 + 日」（与每日任务相同）；
    给 `date`：按当前策略重算那一天的所有用户。同步执行。

    实现：`V3\AdminCreditSettlementController@store`
  security:
    -
      bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            date:
              type: string
              description: 只重算这一天（UTC，Y-m-d），不早于积分上线日、不晚于今天
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - day
                      - missing
                  from:
                    type: string
                  to:
                    type: string
                  users:
                    type: integer
                  pairs:
                    type: integer
                    nullable: true
                  trigger:
                    type: string
                    enum:
                      - cli
                      - admin
                  operator:
                    type: string
                    nullable: true
                  ran_at:
                    type: string
                  seconds:
                    type: number
    201:
      description: '结算完成。响应体与 200 同形'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - day
                      - missing
                  from:
                    type: string
                  to:
                    type: string
                  users:
                    type: integer
                  pairs:
                    type: integer
                    nullable: true
                  trigger:
                    type: string
                    enum:
                      - cli
                      - admin
                  operator:
                    type: string
                    nullable: true
                  ran_at:
                    type: string
                  seconds:
                    type: number
    401:
      $ref: '../../main.yaml#/components/responses/ProblemUnauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
