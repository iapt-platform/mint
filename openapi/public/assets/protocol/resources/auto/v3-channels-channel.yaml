                    type: string
                  source_id:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    properties:
                      kind: { type: string }
                      id: { type: string }
                      nickName: { type: string }
                      realName: { type: string }
                      avatar: { type: string, nullable: true }
                  abilities:
                    type: object
                    properties:
                      read: { type: boolean }
                      write: { type: boolean }
                      update: { type: boolean }
                      delete: { type: boolean }
                  progress:
                    type: number
                    nullable: true
                    description: 仅在部分查询口径下返回。
                  created_at:
                    type: string
                  updated_at:
