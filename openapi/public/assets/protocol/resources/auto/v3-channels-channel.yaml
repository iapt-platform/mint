    系统 channel 不能改。AI 模型不能改。

    实现：`V3\ChannelController@update`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: channel
      in: path
      required: true
      schema:
        type: string
      description: 'channel uid'
