  tags:
    - channels
  operationId: delete_api_v3_channels_channel_
  description: |-
    软删除，返回被删的 channel。个人 channel 由拥有者删，团队的只有团队 owner 能删。
    channel 下已有译文、术语或逐词时拒绝（409，`content` 列出有哪几类）。系统 channel 不能删。

    实现：`V3\ChannelController@destroy`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: channel
      in: path
      required: true
      schema:
        type: string
      description: 'channel uid'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  summary:
                    type: string
                    nullable: true
                  type:
                    type: string
                  lang:
                    type: string
                  status:
                    type: integer
                  is_system:
                    type: boolean
                  source_type:
                    type: string
                  source_id:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    properties:
                      kind: { type: string }
                      id: { type: string }
                      nickName: { type: string }
                      realName: { type: string }
                      avatar: { type: string, nullable: true }
                  abilities:
                    type: object
                    properties:
                      read: { type: boolean }
                      write: { type: boolean }
                      update: { type: boolean }
                      delete: { type: boolean }
                  progress:
                    type: number
                    nullable: true
                    description: 仅在部分查询口径下返回。
                  created_at:
                    type: string
                  updated_at:
                    type: string
    401:
      $ref: '../../main.yaml#/components/responses/ProblemUnauthorized'
    403:
      description: 不能删除
      content:
        application/problem+json:
