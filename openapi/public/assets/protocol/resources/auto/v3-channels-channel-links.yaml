        type: string
      description: 'channel uid'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  channel_id:
                    type: string
                  derived_from:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      type: { type: string }
                      lang: { type: string }
                      status: { type: integer }
                    nullable: true
                  wbw:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      type: { type: string }
                      lang: { type: string }
                      status: { type: integer }
                    nullable: true
                  fallback:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string }, name: { type: string }, type: { type: string }, lang: { type: string }, status: { type: integer } }
                  term_source:
                    type: array
