delete:
  summary: 批量删除术语
  tags:
    - terms
  operationId: delete_api_v2_terms_term_
  description: |-
    需要登录。一次可以删除多条，返回实际删除的条数；无权限的条目被跳过而不报错。
    传了 uuid 参数时，id 按数组处理：owner 本人可删，非 owner 且术语属于某个 channel 时
    需要该 channel 的协作权限达到 20（编辑）才可删，studio 级术语非 owner 一律跳过。
    未传 uuid 时，id 按 JSON 字符串数组处理，且只能删除 owner 是当前用户的术语。
    每删一条都会清除该词对应的 term 缓存。

    实现：`DhammaTermController@destroy`
  parameters:
    -
      name: term
      in: path
      required: true
      schema:
        type: string
    -
      name: uuid
      in: query
      schema:
        type: string
      description: '存在该参数即表示 id 以数组形式提交，并启用 channel 协作者删除权限判定'
    -
      name: id
      in: query
      schema:
        type: array
      description: '要删除的术语 id 列表。带 uuid 时为数组，否则为 JSON 数组字符串'
      required: true
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
