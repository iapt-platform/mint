get:
  summary: 查询单条术语
  tags:
    - terms
  operationId: get_api_v2_terms_term_
  description: |
    已被 `GET /v3/terms/{term}` 取代（正文是新渲染器的「摘要 + 正文」，节点树 `body` 或 `format=html` 的 `html`；
    可用 `channels` / `mode` 指定渲染版本与模式）。保留仅为 dashboard-v4、旧客户端兼容，待 v4 下线后删除。
  parameters:
    -
      name: term
      in: path
      required: true
      schema:
        type: string
    -
      name: channel
      in: query
      schema:
        type: string
      description: '渲染 note 时使用的 channel 列表，多个用下划线分隔； 不传则按术语自身的 channel 或对应语言的社区 channel 渲染'
    -
      name: mode
      in: query
      schema:
        type: string
        default: read
      description: 渲染模式
    -
      name: format
      in: query
      schema:
        type: string
        enum:
          - react
          - html
          - text
        default: react
      description: 'note 的渲染输出格式'
    -
      name: community_summary
      in: query
      schema:
        type: boolean
      description: '传入该参数时，没有 note 的术语回落到社区解释作为 summary'
    -
      name: exp
      in: query
      schema:
        type: boolean
      description: 传入该参数时附带编辑者累计经验值（秒）
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  id:
                    type: integer
                  guid:
                    type: string
                  word:
                    type: string
                  word_en:
                    type: string
                  meaning:
                    type: string
                  other_meaning:
                    type: string
                  tag:
                    type: string
                  note:
                    type: string
                  language:
                    type: string
                  channel_id:
                    type: integer
                  channal:
                    type: string
                  studio:
                    type: string
                  editor:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  mode:
                    type: string
                  format:
                    type: string
                  studioId:
                    type: string
                  channel:
                    type: string
                  html:
                    type: string
                  summary_is_community:
                    type: string
                  summary:
                    type: string
                  role:
                    type: string
                  exp:
                    type: string
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
  deprecated: true
