delete:
  summary: 批量删除术语
  tags:
    - terms
  operationId: delete_api_v2_terms_term_
  description: |
    已被 `DELETE /v3/terms/{term}` 取代（一次一条、软删除，返回被删的术语；v2 的 body 里传一批 id 不再支持）。
    保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
  parameters:
    -
      name: term
      in: path
      required: true
      schema:
        type: string
    -
      name: uuid
      in: query
      schema:
        type: string
      description: '存在该参数即表示 id 以数组形式提交，并启用 channel 协作者删除权限判定'
    -
      name: id
      in: query
      schema:
        type: array
      description: '要删除的术语 id 列表。带 uuid 时为数组，否则为 JSON 数组字符串'
      required: true
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
