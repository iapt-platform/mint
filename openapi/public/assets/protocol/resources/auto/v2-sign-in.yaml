# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v2-sign-in.yaml
post:
  summary: 'signIn sign-in'
  tags:
    - sign-in
  operationId: post_api_v2_sign_in
  description: 实现：`AuthController@signIn`
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
            password:
              type: string
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: string
                description: '登录成功后返回的 JWT token'
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
