# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-groups-group-invite-links.yaml
post:
  summary: 签一张团队邀请链接
  tags:
    - groups
  operationId: post_api_v3_groups_group_invite_links
  description: |-
    团队的 owner / manager 才能调用。7 天有效，经它加入的成员角色是 reader（只读）。
    链接不能单独作废：签发人被移出团队或降为 editor / reader 时，他签的链接全部失效。

    实现：`V3\GroupInviteLinkController@store`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: group
      in: path
      required: true
      schema:
        type: string
      description: '团队 uid'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                  expires_at:
                    type: string
    201:
      description: 签发成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
                  expires_at:
                    type: string
    401:
      $ref: '../../main.yaml#/components/responses/ProblemUnauthorized'
    403:
      description: '不能管理这个团队的成员，或用 AI 模型的 token 调用'
      content:
        application/problem+json:
          schema:
            $ref: '../../main.yaml#/components/schemas/ProblemDetails'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
