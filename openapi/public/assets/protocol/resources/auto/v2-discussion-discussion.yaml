delete:
  summary: '删除讨论 / 批注'
  tags:
    - discussion
  operationId: delete_api_v2_discussion_discussion_
  description: |-
    必须登录，未登录返回 401。目前只允许作者本人删除，其他人返回 403。
    不会级联删除子回复，也不会回退父节点的 children_count。

    实现：`DiscussionController@destroy`
  parameters:
    -
      name: discussion
      in: path
      required: true
      schema:
        type: string
      description: '讨论 id'
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
