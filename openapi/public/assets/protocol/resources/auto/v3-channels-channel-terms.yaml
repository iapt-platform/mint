                      id: { type: string }
                      name: { type: string }
                      type: { type: string }
                      lang: { type: string }
                      studio_id: { type: string }
                      status: { type: integer }
                    nullable: true
                  owner_id:
                    type: string
                  quality:
                    type: string
                    nullable: true
                  content_type:
                    type: string
                  summary:
                    type: string
                    nullable: true
                  note:
                    type: string
                    nullable: true
                  redirect:
                    type: string
