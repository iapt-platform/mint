delete:
  summary: '删除 article（文章）'
  tags:
    - article
  operationId: delete_api_v2_article_article_
  description: |-
    需要登录，且只有文章 owner 本人可以删除（协作者不行），否则返回鉴权失败。
    副作用：在事务中删除文章记录，并同步把该文章从所有文集目录（article_collections）中摘除。

    实现：`ArticleController@destroy`
  parameters:
    -
      name: article
      in: path
      required: true
      schema:
        type: string
      description: '文章 uid（路由模型绑定）'
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
