delete:
  summary: 删除用户词典记录（支持批量）
  tags:
    - userdict
  operationId: delete_api_v2_userdict_userdict_
  description: |-
    需要登录，未登录返回 403。传了查询参数 id（JSON 数组）时走批量分支，逐条只删除 creator_id
    等于当前用户的记录，返回 [实际删除条数, 汇总表更新结果]；否则删除路径参数指定的单条记录，
    非本人创建返回 auth.failed。两种分支都会同步刷新 _SYS_USER_WBW_ 汇总与 Redis 缓存 dict/user。

    实现：`UserDictController@destroy`
  parameters:
    -
      name: userdict
      in: path
      required: true
      schema:
        type: string
      description: '要删除的词条 id（未传查询参数 id 时使用）'
    -
      name: id
      in: query
      schema:
        type: string
      description: '要批量删除的词条 id 数组的 JSON 字符串'
      example: '["123","456"]'
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
