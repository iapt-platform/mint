get:
  summary: 查询单条用户词典记录
  tags:
    - userdict
  operationId: get_api_v2_userdict_userdict_
  description: |-
    按主键查找，不做登录与权限校验；查不到返回「没有查询到数据」。

    实现：`UserDictController@show`
  parameters:
    -
      name: userdict
      in: path
      required: true
      schema:
        type: string
      description: '词条 id'
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
put:
  summary: 更新单条用户词典记录
  tags:
    - userdict
  operationId: put_api_v2_userdict_userdict_
  description: |-
    把请求体中的全部字段直接写入该记录（未做字段白名单与权限校验）。
    更新成功后同步刷新系统汇总词典 _SYS_USER_WBW_ 与该单词的 Redis 缓存 dict/user。
    没有记录被更新时返回「没有查询到数据」。

    实现：`UserDictController@update`
  parameters:
    -
      name: userdict
      in: path
      required: true
      schema:
        type: string
      description: '词条 id'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            word:
              type: string
              description: 单词
            type:
              type: string
              description: 词性
            grammar:
              type: string
              description: 语法属性
            parent:
              type: string
              description: 词根
            mean:
              type: string
              description: 词义
            factors:
              type: string
              description: 复合词拆分
            factormean:
              type: string
              description: 复合词各部分词义
            note:
              type: string
              description: 备注
            confidence:
              type: integer
              description: 置信度
            status:
              type: integer
              description: '状态，大于 5 表示公开到社区'
            language:
              type: string
              description: 语言代码
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
