                    name:
                      type: string
                    summary:
                      type: string
                      nullable: true
                    type:
                      type: string
                    lang:
                      type: string
                    status:
                      type: integer
                    is_system:
                      type: boolean
                    source_type:
                      type: string
                    source_id:
                      type: string
                      nullable: true
                    owner:
                      type: object
                      properties: { kind: { type: string }, id: { type: string }, nickName: { type: string }, realName: { type: string }, avatar: { type: string, nullable: true } }
                    abilities:
                      type: object
                      properties: { read: { type: boolean }, write: { type: boolean }, update: { type: boolean }, delete: { type: boolean } }
