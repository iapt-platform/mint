                    id:
                      type: string
                    word:
                      type: string
                    tag:
                      type: string
                      nullable: true
                    meaning:
                      type: string
                    other_meaning:
                      type: string
                      nullable: true
              meta:
                type: object
                properties:
                  kind:
                    type: string
                    description: 哪张表
                  lang:
                    type: string
                    description: '实际用到的语言（没有该语言的表时是 en）'
                  total:
                    type: integer
                    description: 条数
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
