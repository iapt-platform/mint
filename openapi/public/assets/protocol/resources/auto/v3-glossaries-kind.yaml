  description: |-
    整表返回、不分页（客户端启动时拉一次，本地查词）。`meta.lang` 是实际用到的语言：
    该语言没有这张表时回退到英文。

    实现：`V3\GlossaryController@__invoke`
  security:
    - {  }
    -
      bearerAuth: []
  parameters:
    -
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - grammar
          - community
      description: '哪张表：grammar 语法术语，community 社区译名'
    -
      name: lang
      in: query
      schema:
        type: string
      description: '语言，如 zh-Hans。缺省用界面语言（Accept-Language 协商的结果）'
  responses:
    200:
      description: 成功
      content:
