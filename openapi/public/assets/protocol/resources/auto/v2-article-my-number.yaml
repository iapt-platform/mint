get:
  summary: 统计我的文章数量
  tags:
    - article-my-number
  operationId: get_api_v2_article_my_number
  description: |-
    返回指定 studio 下「我的」和「协作的」两类文章条数。
    需要登录，且当前登录用户必须就是 studio 的拥有者，否则返回鉴权失败。

    实现：`ArticleController@showMyNumber`
  parameters:
    -
      name: studio
      in: query
      schema:
        type: string
      description: 'studio 名称，必须与当前登录用户一致'
      required: true
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
