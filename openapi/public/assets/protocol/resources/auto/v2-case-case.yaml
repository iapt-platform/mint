get:
  summary: 输入一个单词，输出三藏中所有可能的变形
  tags:
    - case
  operationId: get_api_v2_case_case_
  description: |
    已被 `GET /v3/pali-word-forms/{word}` 取代：候选词形一次批量查出现次数（v2 逐个词形查库，一个词上百次），
    去掉了每条里多余的 `"0": "ending"` 键，词不区分大小写。字段：`rows[].word`→`data[].base`，`rows[].case`→`data[].forms`，
    `count`→`meta.total`；没有任何词形出现过的词根不再列出。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
  parameters:
    -
      name: case
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
  deprecated: true
