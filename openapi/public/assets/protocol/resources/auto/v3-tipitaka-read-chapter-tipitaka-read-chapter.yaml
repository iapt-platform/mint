# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-tipitaka-read-chapter-tipitaka-read-chapter.yaml
get:
  summary: '按 id 读取章节'
  tags:
    - tipitaka-read-chapter
  operationId: get_api_v3_tipitaka_read_chapter_tipitaka_read_chapter_
  description: |-
    与 index 等价，只是把 book 与 para 合成一个路径参数；游标 `from` 仍走
    查询参数。格式不对或 channel 不是 uuid 返回 422。

    实现：`TipitakaReadChapterController@show`
  parameters:
    -
      name: tipitaka_read_chapter
      in: path
      required: true
      schema:
        type: string
      description: '章节 id，格式 {book}-{para}'
      example: 9002-1
    -
      name: channel
      in: query
      schema:
        type: string
      description: '译文 channel 的 uuid'
      required: true
    -
      name: from
      in: query
      schema:
        type: integer
      description: '起点游标，从这一段开始取；不传则从章节开头取起。 超出章节区间返回 422'
    -
      name: format
      in: query
      schema:
        type: string
        enum:
          - html
          - markdown
          - react
          - text
        default: html
      description: 内容格式
    -
      name: view
      in: query
      schema:
        type: string
        enum:
          - display
          - sentences
          - all
        default: display
      description: '输出口径：display 整段合并，sentences 逐句，all 两者都给'
    -
      name: pagesize
      in: query
      schema:
        type: integer
        default: '10'
      description: '每块大小，含义由 unit 决定。上限 unit=para 时 200、 unit=byte 时 5000，超出不报错按上限算，meta.page_size 回实际 生效的值'
    -
      name: unit
      in: query
      schema:
        type: string
        enum:
          - para
          - byte
        default: para
      description: '每块大小的单位：para 按段落数，byte 按段落长度累加。 两种单位下每块都至少一段、至多 200 段'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
