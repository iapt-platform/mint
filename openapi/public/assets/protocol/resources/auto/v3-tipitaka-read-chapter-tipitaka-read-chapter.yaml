# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-tipitaka-read-chapter-tipitaka-read-chapter.yaml
get:
  summary: '按 id 读取章节'
  tags:
    - tipitaka-read-chapter
  operationId: get_api_v3_tipitaka_read_chapter_tipitaka_read_chapter_
  description: |-
    与 index 等价，只是把 book 与 para 合成一个路径参数。格式不对或 channel
    不是 uuid 返回 422。

    实现：`TipitakaReadChapterController@show`
  parameters:
    -
      name: tipitaka_read_chapter
      in: path
      required: true
      schema:
        type: string
      description: '章节 id，格式 {book}-{para}'
      example: 9002-1
    -
      name: channel
      in: query
      schema:
        type: string
      description: '译文 channel 的 uuid'
      required: true
    -
      name: format
      in: query
      schema:
        type: string
        enum:
          - html
          - markdown
          - react
          - text
        default: html
      description: 内容格式
    -
      name: view
      in: query
      schema:
        type: string
        enum:
          - display
          - sentences
          - all
        default: display
      description: '输出口径：display 整段合并，sentences 逐句，all 两者都给'
    -
      name: pagesize
      in: query
      schema:
        type: string
        default: 20000b
      description: '每页大小，两种写法：`20000b` 按字节累加段落长度 （每页至少一段），`10p` 按段落数'
    -
      name: page
      in: query
      schema:
        type: integer
        default: '1'
      description: '页码，从 1 开始。超出范围返回 422'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
