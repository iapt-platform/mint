# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v2-para-info.yaml
get:
  summary: '取一个章节内 pali_texts 的全部段落记录。'
  tags:
    - para-info
  operationId: get_api_v2_para_info
  description: |-
    以 (book, para) 定位章节起始段，再按 chapter_len 取出该章节覆盖的整段区间。
    每条记录附带 related_paragraphs 里的 CS6 锚点（book_name + cs_para），
    没有锚点的段落这两个字段为 null——约 2% 的段落没有锚点，属正常情况。

    实现：`ParaInfoController@index`
  parameters:
    -
      name: search
      in: query
      description: 搜索关键字
      schema:
        type: string
    -
      name: order
      in: query
      description: 排序字段
      schema:
        type: string
    -
      name: dir
      in: query
      description: 排序方向
      schema:
        type: string
        enum:
          - desc
          - asc
    -
      name: limit
      in: query
      description: 每页记录数
      schema:
        type: number
    -
      name: offset
      in: query
      description: 从第几条记录开始提取
      schema:
        type: number
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
post:
  summary: '新建 para-info'
  tags:
    - para-info
  operationId: post_api_v2_para_info
  description: 实现：`ParaInfoController@store`
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
