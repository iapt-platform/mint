delete:
  summary: 删除课程成员记录
  tags:
    - course-member
  operationId: delete_api_v2_course_member_course_member_
  description: |-
    必须登录。课程所有者（course.studio_id 等于当前用户）可以直接删除；
    否则按当前用户在该课程中的角色判断权限，普通 student 无删除权限，返回 auth.failed。

    实现：`CourseMemberController@destroy`
