delete:
  summary: 删除任务
  tags:
    - task
  operationId: delete_api_v2_task_task_
  description: |-
    必须登录（否则 401），且当前用户必须是任务拥有者，否则返回 403。
    删除成功返回 ok，失败返回 500。

    实现：`TaskController@destroy`
  parameters:
    -
      name: task
      in: path
      required: true
      schema:
        type: string
      description: '任务 uuid'
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
