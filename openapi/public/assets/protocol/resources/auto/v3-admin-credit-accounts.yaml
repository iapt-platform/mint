# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-admin-credit-accounts.yaml
get:
  summary: 列出积分账号
  tags:
    - admin
  operationId: get_api_v3_admin_credit_accounts
  description: |-
    有积分流水的账号（登录用户与游客设备），每行是该账号的汇总：积分余额、累计赚取、累计手工调整、
    累计消耗、今天用掉的赠送额度。最近有动静的在前。没有任何流水的用户不在列表里，
    但仍可以直接给他加积分（`POST /v3/admin/credit-adjustments`）。

    实现：`V3\AdminCreditAccountController@index`
  security:
    -
      bearerAuth: []
  parameters:
    -
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
      description: '每页数量，最大 100'
    -
      name: 'filter[account_type]'
      in: query
      schema:
        type: string
        enum:
          - user
          - guest
      description: 账号类型
    -
      name: 'filter[q]'
      in: query
      schema:
        type: string
      description: '登录用户按用户名 / 昵称 / 邮箱模糊匹配，游客按设备 id 前缀匹配'
    -
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: 页码
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    account_type:
                      type: string
                      enum: [user, guest]
                    account_id:
                      type: string
                    user:
                      type: object
                      properties: { id: { type: string }, nickName: { type: string }, userName: { type: string }, realName: { type: string }, sn: { type: integer }, avatar: { type: string }, roles: { type: array, items: { type: string } } }
                      nullable: true
                    earned_balance:
                      type: integer
                    earned_total:
                      type: integer
                    adjusted_total:
                      type: integer
                    spent_total:
                      type: integer
                    free_used_today:
                      type: integer
                    daily_free:
                      type: integer
                    last_activity_at:
                      type: string
                      nullable: true
              meta:
                $ref: '../../main.yaml#/components/schemas/PaginationMeta'
    401:
      $ref: '../../main.yaml#/components/responses/ProblemUnauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
