# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-tipitaka-chapter-channels-book-para.yaml
get:
  summary: '列出一章的 channel'
  tags:
    - tipitaka-chapter-channels
  operationId: get_api_v3_tipitaka_chapter_channels_book_para_
  description: |-
    按完成度从高到低。只列看得见的 channel：公开的，加上登录用户自己的、共享给他（或他所在群组）的；
    未登录只看得到公开的。章节不存在或没有任何 channel 时返回空列表。
    `progress` 是 0–1 的完成度；`progress_line` 是近几周每周的修改次数（从早到晚，由 `upgrade:chapter.dynamic.weekly` 每周算一次，
    没算过就是 null），画活跃度小图用；
    `views` 是这一章在该 channel 下被浏览的次数。

    实现：`V3\TipitakaChapterChannelController@__invoke`
  security:
    - {  }
    -
      bearerAuth: []
  parameters:
    -
      name: book
      in: path
      required: true
      schema:
        type: integer
      description: 书号
      example: 94
    -
      name: para
      in: path
      required: true
      schema:
        type: integer
      description: 章节起始段落号
      example: 385
    -
      name: per_page
      in: query
      schema:
        type: integer
        default: 100
      description: '每页数量，最大 200'
    -
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: 页码
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    book:
                      type: integer
                    para:
                      type: integer
                    progress:
                      type: number
                    progress_line:
                      type: array
                      items: { type: integer }
                      nullable: true
                    views:
                      type: integer
                    updated_at:
                      type: string
                    channel:
                      type: object
                      properties: { id: { type: string }, name: { type: string }, type: { type: string }, lang: { type: string } }
                    studio:
                      type: object
                      properties: { id: { type: string }, nickName: { type: string }, realName: { type: string }, avatar: { type: string, description: 仅在部分查询口径下返回。 } }
                      nullable: true
              meta:
                $ref: '../../main.yaml#/components/schemas/PaginationMeta'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
