# 由 openapi/scripts/generate.php 生成，请勿手改；补充写到 overrides/v3-search-search.yaml
get:
  summary: '按 id 取单条检索结果'
  tags:
    - search
  operationId: get_api_v3_search_search_
  description: |-
    直接从 OpenSearch 按文档 id 取回，不走检索。取不到返回 404。
    整章正文文档（`tipitaka_chapter_{book}-{para}_{channel}`）按它所属 channel 判权限：
    私有 channel 只有拥有者、团队成员、被共享的人能读（要带 token）。索引里收了所有 channel，
    不在这里挡的话拼出 id 就能读到私有正文。

    实现：`V3\SearchPlusController@show`
  security:
    - {  }
    -
      bearerAuth: []
  parameters:
    -
      name: search
      in: path
      required: true
      schema:
        type: string
      description: 'OpenSearch 文档 id'
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    403:
      description: '整章正文所属的 channel 是私有的，且当前身份看不见'
      content:
        application/problem+json:
          schema:
            $ref: '../../main.yaml#/components/schemas/ProblemDetails'
    422:
      $ref: '../../main.yaml#/components/responses/ProblemValidation'
