                    nullable: true
                  language:
                    type: string
                  channel_id:
                    type: string
                    nullable: true
                  channel:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                    nullable: true
                  owner_id:
                    type: string
                  quality:
                    type: string
                    nullable: true
                  content_type:
                    type: string
                  summary:
                    type: string
                    nullable: true
                  note:
                    type: string
                    nullable: true
                  redirect:
                    type: string
                    nullable: true
                  categories:
                    type: array
                    items:
                      type: string
                  summary_text:
                    type: string
                  body:
