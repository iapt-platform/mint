<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · Tipitaka 新路由 Demo</title>
<style>
:root{
  --primary:#206bc4; --primary-weak:#e8f0fa; --text:#1d273b; --muted:#667382;
  --border:#e6e7e9; --bg:#f5f7fb; --card:#fff; --green:#2fb344; --yellow:#f59f00; --red:#d63939;
  --radius:6px; --serif:"Noto Serif SC","Source Han Serif SC",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
a{color:inherit;text-decoration:none}
a:hover{color:var(--primary)}
/* demo 外壳：模拟地址栏 */
.demo-bar{position:sticky;top:0;z-index:20;background:#1d273b;color:#cfd6e0;padding:.4rem 1rem;display:flex;gap:.75rem;align-items:center;font:12px/1.4 ui-monospace,Menlo,monospace}
.demo-bar .url{flex:1;background:#2b3648;border-radius:4px;padding:.3rem .6rem;color:#fff;overflow:auto;white-space:nowrap}
.demo-bar .route{color:#8fb4e8}
.demo-bar select{font:inherit;background:#2b3648;color:#fff;border:0;border-radius:4px;padding:.3rem}
/* 站点头 */
.navbar{background:#fff;border-bottom:1px solid var(--border)}
.navbar .inner{max-width:1240px;margin:auto;padding:.6rem 1rem;display:flex;gap:1.5rem;align-items:center}
.brand{font-weight:700;font-size:1.05rem}
.navbar nav a{margin-right:1rem;color:var(--muted)} .navbar nav a.active{color:var(--primary);font-weight:600}
.container{max-width:1240px;margin:auto;padding:1rem}
.crumb{font-size:13px;color:var(--muted);margin:.25rem 0 1rem}
.crumb a{color:var(--primary)} .crumb span.sep{margin:0 .4rem;color:#bbb}
/* 三栏 */
.layout{display:grid;grid-template-columns:220px 1fr 260px;gap:1rem;align-items:start}
.layout.two{grid-template-columns:240px 1fr}
.layout.one{grid-template-columns:1fr}
@media(max-width:960px){.layout,.layout.two{grid-template-columns:1fr}.side-right{display:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.card h3,.side h3{margin:0 0 .75rem;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.side .card{padding:.85rem}
.list{list-style:none;margin:0;padding:0}
.list li a{display:flex;justify-content:space-between;padding:.35rem .5rem;border-radius:4px}
.list li a.active,.list li a:hover{background:var(--primary-weak);color:var(--primary)}
.count{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:.15rem .65rem;border:1px solid var(--border);border-radius:999px;margin:0 .35rem .35rem 0;font-size:13px;background:#fff;cursor:pointer}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.label{color:var(--muted);width:3.5em;flex:none}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .9rem;border-radius:4px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.block{width:100%;justify-content:center;margin-bottom:.5rem}
.search{width:100%;padding:.6rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:15px}
.tag{display:inline-block;font-size:11px;padding:0 .4rem;border-radius:3px;background:#eef1f5;color:var(--muted);margin-left:.25rem}
.tag.t-translation{background:#e8f0fa;color:#206bc4}.tag.t-original{background:#ebf7ee;color:#2fb344}
.tag.t-nissaya{background:#fff4e5;color:#c77700}.tag.t-commentary{background:#f3ebfa;color:#7a3fc4}
/* hero */
.hero{background:linear-gradient(135deg,#1a2d4a,#3d6aa3);color:#fff;padding:3rem 1rem;text-align:center}
.hero h1{margin:0 0 .5rem;font-family:var(--serif);font-size:2rem}
.hero p{opacity:.8;margin:0 0 1.25rem}
.hero .search{max-width:560px;border:0}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem}
.tile{display:flex;gap:.6rem;align-items:center;padding:.7rem .8rem;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.tile:hover{border-color:var(--primary)}
.tile .ic{width:28px;height:28px;border-radius:4px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-size:14px;flex:none}
.tile small{display:block;color:var(--muted);font-size:12px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
.book .cover{aspect-ratio:3/4;border-radius:4px;color:#fff;padding:.7rem;display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--serif);font-size:14px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.book .t{margin-top:.4rem;font-weight:600;font-size:13px;line-height:1.35}
.book .m{color:var(--muted);font-size:12px}
.bar{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--green)}
.channel-row{display:flex;gap:.75rem;align-items:center;padding:.65rem .25rem;border-bottom:1px solid var(--border)}
.channel-row:last-child{border:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.channel-row .grow{flex:1;min-width:0}
.channel-row .name{font-weight:600}
.channel-row .meta{color:var(--muted);font-size:12px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .5rem}
.section-title h2{font-size:1.05rem;margin:0}
.pager{display:flex;gap:.25rem;justify-content:center;margin-top:1rem}
.pager a{min-width:32px;text-align:center;padding:.25rem .5rem;border:1px solid var(--border);border-radius:4px;background:#fff}
.pager a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager span{padding:.25rem .3rem;color:var(--muted)}
.otree ul{list-style:none;margin:0;padding-left:26px}
.otree li{position:relative;margin:8px 0}
.otree ul > li::before{content:"";position:absolute;left:-16px;top:0;bottom:-8px;border-left:1px solid var(--border)}
.otree ul > li:last-child::before{bottom:auto;height:22px}
.otree ul > li::after{content:"";position:absolute;left:-16px;top:22px;width:14px;border-top:1px solid var(--border)}
.onode{display:inline-flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:#fff}
.onode .tg{width:20px;height:20px;padding:0;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.onode .t{font-weight:700}
.onode .bar{width:70px;margin:0}
.olvl0 > .onode{background:var(--text);color:#fff;border-color:var(--text)} .olvl0 > .onode .tg,.olvl0 > .onode .cnt{color:#cfd6e0}
.olvl1 > .onode{background:#f3e2c7;border-color:#c4761c}
.olvl2 > .onode{background:var(--primary-weak);border-color:var(--primary)}
.otree .cnt{font-size:12px;color:var(--muted);font-weight:400}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:8px 0 4px 26px}
.ocard{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.ocard .top{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;color:var(--muted)}
.ocard .key{font-family:ui-monospace,monospace;background:var(--bg);padding:1px 6px;border-radius:4px}
.ocard ol{margin:0;padding:0;list-style:none}
.ocard li{border-top:1px dotted var(--border);margin:0}
.ocard li::before,.ocard li::after{display:none}
.ocard li:first-child{border-top:0}
.ocard li a{display:flex;gap:.5rem;align-items:center;padding:4px 0;font-size:13px}
.ocard .wt{flex:1;min-width:0;overflow-wrap:anywhere}
.ocard .wp{width:84px;flex:none;display:flex;gap:.35rem;align-items:center;font-size:11px;color:var(--muted)}
.ocard .wp .bar{flex:1;margin:0}
.ocard li.missing a{color:#aab;pointer-events:none}
.otree .collapsed > ul,.otree .collapsed > .ocards{display:none}
.otree .hidden{display:none !important}
.otree mark{background:#fff1a8;border-radius:2px}
.tree-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem}
.tree-bar .search{width:260px;padding:.4rem .7rem;font-size:13px}
.cat4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.5rem}
@media(max-width:960px){.cat4{grid-template-columns:repeat(2,1fr)}}
.cat4 .card{margin:0;height:100%}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.cat-head b{font-size:15px}
.cat-head a{font-size:12px;color:var(--primary)}
.list-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.ch-head{display:flex;gap:1rem;align-items:center}
.ch-head .avatar{width:56px;height:56px;font-size:1.3rem}
.ch-head h1{margin:0;font-size:1.35rem}
.tabs{display:flex;gap:1.25rem;border-bottom:1px solid var(--border);margin:1rem 0 0}
.tabs a{padding:.5rem 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs a.active{color:var(--primary);border-color:var(--primary);font-weight:600}
.meta-table td{padding:.2rem .75rem .2rem 0;vertical-align:top}.meta-table td:first-child{color:var(--muted);white-space:nowrap}
.toc li{list-style:none;border-bottom:1px dashed var(--border)}
.toc{padding:0;margin:0}
.toc a{display:flex;gap:1rem;align-items:center;padding:.5rem .25rem}
.toc .lv3{padding-left:1.5rem;font-size:13px}
.toc .tt{flex:1}
.toc .pg{width:110px;display:flex;gap:.4rem;align-items:center;font-size:12px;color:var(--muted)}
.toc .pg .bar{flex:1;margin:0}
.toc a.disabled{color:#aab;pointer-events:none}
.note{background:#fffbea;border:1px solid #f3e3a1;border-radius:var(--radius);padding:.6rem .8rem;font-size:13px;color:#7a5d00;margin-bottom:1rem}
.note code{background:#fff3c4;padding:0 .25rem;border-radius:3px}
.redirect{max-width:620px;margin:3rem auto;text-align:center}
.redirect pre{text-align:left;background:#1d273b;color:#d6e2f0;padding:1rem;border-radius:var(--radius);font-size:12px;overflow:auto}
/* reader */
.reader{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 34px)}
.reader aside{background:#fff;border-right:1px solid var(--border);padding:1rem;font-size:13px;overflow:auto}
.reader aside .wt{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:.25rem}
.reader aside .toc a{padding:.3rem .25rem}
.reader aside .toc a.active{color:var(--primary);font-weight:600}
.reader main{padding:1.5rem 2rem;max-width:820px}
.reader .topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.reader select{padding:.35rem .5rem;border:1px solid var(--border);border-radius:4px;font-size:13px;max-width:240px}
.reader h1{font-family:var(--serif);font-size:1.6rem;margin:.25rem 0 1rem}
.reader p{font-family:var(--serif);font-size:17px;line-height:1.9}
.reader p .pali{display:block;font-size:14px;color:var(--muted);font-style:italic}
.reader .nav{display:flex;justify-content:space-between;margin-top:2rem;border-top:1px solid var(--border);padding-top:1rem}
@media(max-width:860px){.reader{grid-template-columns:1fr}.reader aside{display:none}}
</style>
</head>

/* 分页：对应后端 ->paginate($size)->withQueryString()，页码走 ?page=，其余查询串原样保留 */
const paginate = (list, q, size) => {
  const pages = Math.max(1, Math.ceil(list.length/size));
  const page = Math.min(pages, Math.max(1, parseInt(q.get('page')) || 1));
  return {items:list.slice((page-1)*size, page*size), page, pages, total:list.length};
};
const pageHref = (path, q, n) => {
  const p = new URLSearchParams(q);
  n > 1 ? p.set('page', n) : p.delete('page');
  const s = p.toString();
  return `#${path}${s ? '?'+s : ''}`;
};
const pager = (path, q, pg) => {
  if (pg.pages <= 1) return '';
  const nums = [];
  for (let i = 1; i <= pg.pages; i++) {
    if (i===1 || i===pg.pages || Math.abs(i-pg.page)<=2) nums.push(i);
    else if (nums[nums.length-1] !== '…') nums.push('…');
  }
  const a = (n, t, cls='') => `<a href="${pageHref(path,q,n)}" class="${cls}">${t}</a>`;
  return `<div class="pager">${pg.page>1?a(pg.page-1,'‹ 上一页'):''}${nums.map(n=>n==='…'?'<span>…</span>':a(n,n,n===pg.page?'active':'')).join('')}${pg.page<pg.pages?a(pg.page+1,'下一页 ›'):''}</div>`;
};

// 该 channel 对某部作品的进度（0..1）；null = 该 channel 没有收录这部作品
// 收录范围与 ④ 共用 channelWorks()，两页的作品数一致
const CH_SET = {};
const chProgress = (uid, sn) => {
  const set = CH_SET[uid] || (CH_SET[uid] = new Set(channelWorks(uid).map(w => w.sn)));
  if (!set.has(sn)) return null;
  return ((strHash(uid + '#' + sn) >>> 9) % 101) / 100;
};
const barColor = v => v >= .8 ? 'var(--green)' : v >= .3 ? 'var(--yellow)' : 'var(--red)';
const progressBar = v => `<span class="bar"><i style="width:${pct(v)}%;background:${barColor(v)}"></i></span>`;
const catStat = (uid, n) => {
  const items = worksIn(n.id), mine = items.filter(w => chProgress(uid, w.sn) !== null);
  const avg = mine.length ? mine.reduce((a, w) => a + chProgress(uid, w.sn), 0) / mine.length : 0;
  return {total: items.length, mine: mine.length, avg};
};
// 一张卡片 = 一个末级分类（或非末级分类直接挂的作品），列出作品 + 进度条
const workCard = (uid, title, list, showAll) => {
  const rows = list.filter(w => showAll || chProgress(uid, w.sn) !== null);
  if (!rows.length) return '';
  return `<div class="ocard">${title ? `<div class="top"><b>${title}</b></div>` : ''}
    <ol>${rows.map(w => { const v = chProgress(uid, w.sn);
      return `<li data-w="${w.title}" class="${v === null ? 'missing' : ''}"><a href="#${B}/channels/${uid}/work/${w.sn}">
        <span class="wt">${w.title}</span><span class="wp">${v === null ? '未收录' : progressBar(v) + pct(v) + '%'}</span></a></li>`; }).join('')}</ol></div>`;
};
const catNode = (uid, n, lvl, showAll) => {
  const st = catStat(uid, n);
  if (!showAll && !st.mine) return '';
  const leaves = (n.children || []).filter(c => c.leaf), branches = (n.children || []).filter(c => !c.leaf);
  const own = ALL_WORKS.filter(w => w.cat === n.id);
  const cards = [own.length ? workCard(uid, '', own, showAll) : '', ...leaves.map(c => workCard(uid, c.name, worksIn(c.id), showAll))].join('');
  return `<li class="olvl${lvl}"><span class="onode"><button class="tg" aria-label="展开/折叠">▾</button>
    <span class="t">${n.name}</span>${n.name !== n.pali ? `<span class="cnt">${n.pali}</span>` : ''}
    <span class="cnt">${st.mine}${showAll ? ' / ' + st.total : ''} 部</span>${progressBar(st.avg)}<span class="cnt">${pct(st.avg)}%</span></span>
    ${cards ? `<div class="ocards">${cards}</div>` : ''}
    ${branches.length ? `<ul>${branches.map(c => catNode(uid, c, lvl + 1, showAll)).join('')}</ul>` : ''}</li>`;
};
page(`${B}/channels/:uid/category/:id`, '⑤ 单个译本 · 分类视图', ({uid, id}, q, url) => {

    <input class="search" type="search" placeholder="筛选作品，如 jātaka、visuddhi" oninput="orgSearch(this.value)">
    <button class="btn" onclick="orgFold(false)">全部展开</button>

/* 树的折叠与筛选（事件委托，页面重绘后依然有效） */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.otree .tg'); if (!b) return;
  const li = b.closest('li'); li.classList.toggle('collapsed');
  b.textContent = li.classList.contains('collapsed') ? '▸' : '▾';
});
function orgFold(collapse){
  document.querySelectorAll('#otree li[class^="olvl"]').forEach(li => {
    const c = collapse && li.querySelector(':scope > .ocards') !== null && li.querySelector(':scope > ul') === null;
    li.classList.toggle('collapsed', c);
    const b = li.querySelector(':scope > .onode .tg'); if (b) b.textContent = c ? '▸' : '▾';
  });
}
// 去掉变音符逐字比较，位置不错位（ā→a、ṭ→t、ñ→n）
const fold = s => Array.from(s.toLowerCase()).map(c => c.normalize('NFD')[0]).join('');
function orgSearch(raw){
  const q = fold(raw.trim()), esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  document.querySelectorAll('#otree .ocard').forEach(card => {
    let any = !q;
    card.querySelectorAll('li').forEach(li => {
      const w = li.dataset.w, i = fold(w).indexOf(q), t = li.querySelector('.wt');
      const hit = q && i >= 0; if (hit) any = true;
      t.innerHTML = hit ? esc(w.slice(0,i)) + '<mark>' + esc(w.slice(i,i+q.length)) + '</mark>' + esc(w.slice(i+q.length)) : esc(w);
      li.classList.toggle('hidden', !!q && !hit);
    });
    card.classList.toggle('hidden', !any);
  });
  document.querySelectorAll('#otree li[class^="olvl"]').forEach(li => {
    const vis = li.querySelectorAll('.ocard:not(.hidden)').length > 0;
    li.classList.toggle('hidden', !!q && !vis);
    if (q && vis) { li.classList.remove('collapsed'); }
  });
}

/* ───────────────────────── 路由 ───────────────────────── */
const SAMPLES = [`${B}`,`${B}/category/2`,`${B}/channels`,`${B}/channels/3b0cb0aa`,`${B}/channels/3b0cb0aa/category/1`,`${B}/channels/3b0cb0aa/category/48`,
  `${B}/channels/3b0cb0aa/work/99`,`${B}/channels/3b0cb0aa/work/99/read`,`${B}/channels/3b0cb0aa/chapter/93-217`];
$('#jump').innerHTML = '<option value="">跳到…</option>'+SAMPLES.map(s=>{const p=pages.find(p=>p.re.test(s));return `<option value="${s}">${p.title}</option>`}).join('');
$('#jump').onchange = e => { if (e.target.value) location.hash = e.target.value; };
function route(){
  const raw = decodeURIComponent(location.hash.slice(1)) || B;
  const [path, qs = ''] = raw.split('?');
  const q = new URLSearchParams(qs);
  const hit = pages.map(p=>({p,m:path.match(p.re)})).find(x=>x.m);
  $('#url').innerHTML = `127.0.0.1:8000${raw} &nbsp; <span class="route">${hit?hit.p.pattern.replace(B,'…'):'(demo 未实现)'}</span>`;
  if (!hit) { $('#app').innerHTML = navbar()+`<div class="container"><div class="card">demo 未实现这个页面：<code>${path}</code>。${link(B,'回三藏首页')}</div></div>`; return; }
  const html = hit.p.render(hit.m.groups||{}, q, path);
  $('#app').innerHTML = (hit.p.pattern.includes('/chapter/')||hit.p.pattern.endsWith('/read')) ? html : navbar()+html;
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
